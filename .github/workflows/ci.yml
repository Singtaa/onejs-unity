name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same ref makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both platforms rather than stopping at the first red one: a
      # failure on one OS is usually the interesting result, not a reason to
      # hide the other.
      fail-fast: false
      matrix:
        # Windows is deliberate, not symmetry. This suite has already had a failure that reproduced only on Windows (a virtual-filesystem test keyed on POSIX paths while the walk joins with path.sep); a Linux-only gate would not have caught it.
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: onejs-unity

    steps:
      # Checked out into a named folder so onejs-sl sits beside it: the shader
      # language is a "file:../onejs-sl" dev dependency, the layout the
      # packages are developed in inside the container repo, and a lone
      # checkout fails npm ci before any test runs.
      - uses: actions/checkout@v4
        with:
          path: onejs-unity

      - uses: actions/checkout@v4
        with:
          repository: Singtaa/onejs-sl
          ref: main
          path: onejs-sl

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: onejs-unity/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint --if-present

      # --if-present: a package with no test script yet is not a failure here,
      # so this workflow starts gating tests the day they are added.
      - run: npm run test --if-present
